const mailboxes={"규원":[{"title":"낭비","body":"친절을 낭비하고 싶다는 마음,,,, 진짜 멋이써요,,,,,,,"}],"무법자":[{"title":"낭비","body":"무법자🖤흑임자\n쏘 달달"},{"title":"여행","body":"아니 무법자님 스물다섯이신가요?!?!! 무슨 인생 2회차 정도 된 통찰력이라고 생각했는데 놀랍습니다 대체 여행지에서 어떤 일이 있었던거죠 "},{"title":"이름","body":"성함이 문득 궁금해집니다. 연희..? 태희..? 그게 무엇이든 뜻이 강렬하고 멋져요. 저도 한 번 사는 인생 불타게 기쁘게 살고 싶네요."}],"뮴먐":[{"title":"로망","body":"수빈님의 자연스러운 결혼 스냅,,, 상상만해도 너무 좋을 것 같자나...///"}],"샐리":[{"title":"도파민","body":"헉 \u003c\u003c 요기 부분ㅋㅋㅋㅋ 우리 지금 카톡하고 있는 줄 알았어요ㅋㅋㅋㅋ 단양에서는 도파민이 찾아오길,,,^_^"},{"title":"이름","body":"최길동 씨에게 편지 쓰려고 글 첨부터 읽는데 뭐 하나 안 웃긴 게 없네. 당신 글만 뽑아서 인쇄해서 돈 받고 팔고 싶다. (물론 인세는 제겁니다)"}],"스껑":[{"title":"이름","body":"제 이름 까먹지 말아주세요"},{"title":"여행","body":"대얌. 목걸이 드립니다. "},{"title":"낭비","body":"나도 요즘 릴스 덜 보기 챌린지 중이라우... 우리 모두 2027년에는 핸드폰과 조금만 더 멀어질 수 있길.."}],"우최도":[{"title":"낭비","body":"제가 정말정말 갖고싶은 마인드,,, 어떻게 그렇게 유연한 마인드의 소유자가 되셨는지요ㅜ^ㅜ (실례지만 글을 토대로 mbti 한 번 맞춰봐도 될까요,, 혹시 파워 p이신가요,,)"},{"title":"낭비","body":"맞아. 돌이켜보면 모든 시간은 의미 있었지. 설사 그땐 낭비라 생각했을지라도~ 글을 읽으니 괜히 더 앞으로의 시간이 기대되는 것 같네잉"}],"조성니":[{"title":"재능","body":"지에지에가 대체 왜 웃긴지 모르겠는데, 나도 모르게 걍 웃음이 났던 글ㅋㅋㅋㅋㅋ "}],"켈리":[{"title":"낭비","body":"침대 위 끝말잇기, 함께 만드는 라볶이,,, 절로 입꼬리에 미소가 지어집니다 아이들과 함께하는 가족의 모습은 이런 거군요,,🧡"},{"title":"비행기","body":"ㅜㅜ 아가 마음이 넘 따뜻해요,,"},{"title":"낭비","body":"글에 묘사된 행복한 순간들이 읽기만 해도 기분 좋아져요ㅎㅎ 어디서 꺄르르 아이 웃음소리가 들리는 것 같은..!! 이런 낭비라면 백 번도 더 하고 싶어집니다."}]};let letters=[];let current=0;const read=new Set;const dialog=document.querySelector('#letter');const grid=document.querySelector('#grid');function render(){grid.replaceChildren(...letters.map((l,i)=>{const b=document.createElement('button');b.className='envelope';b.setAttribute('aria-label',`${i+1}번째 편지: ${l.title}`);const n=document.createElement('small');n.textContent=`LETTER 0${i+1}`;const t=document.createElement('strong');t.textContent=`「${l.title}」`;const s=document.createElement('span');s.className='seal';s.textContent='♡';const r=document.createElement('span');r.className='readmark';r.textContent=read.has(i)?'열어본 편지 · 다시 읽기':'아직 열지 않은 마음 ↗';b.append(t,s);b.onclick=()=>show(i);return b}))}function show(i){if(!activeUser||i<0||i>=letters.length)return;current=i;read.add(i);document.querySelector('#title').textContent=`「${letters[i].title}」에 온 편지`;document.querySelector('#body').textContent=letters[i].body;render();if(!dialog.open)dialog.showModal();dialog.scrollTop=0}const accounts={'규원':'0519','무법자':'0915','뮴먐':'1128','샐리':'7905','스껑':'0797','우최도':'8515','조성니':'2895','켈리':'1545'};const login=document.querySelector('#login');let activeUser=null;document.querySelector('#open').onclick=()=>{document.querySelector('#login-form').reset();document.querySelector('#login-error').textContent='';login.showModal()};document.querySelector('#login-close').onclick=()=>login.close();login.onclick=e=>{if(e.target===login)login.close()};document.querySelector('#login-form').onsubmit=e=>{e.preventDefault();const nickname=document.querySelector('#nickname').value.trim();const password=document.querySelector('#password').value;if(!Object.hasOwn(accounts,nickname)||accounts[nickname]!==password){document.querySelector('#login-error').textContent='닉네임 또는 비밀번호를 다시 확인해 주세요.';return}activeUser=nickname;letters=mailboxes[nickname]||[];current=0;read.clear();render();document.querySelector('#inbox-title').textContent=nickname+'님의 우체통';document.querySelector('#inbox-count').textContent='총 '+letters.length+'개의 마음이 도착했어요.';document.querySelector('#inbox-hint').hidden=!letters.length;document.querySelector('#password').value='';login.close();document.querySelector('#home').classList.add('hidden');document.querySelector('#inbox').classList.remove('hidden');window.scrollTo(0,0)};document.querySelector('#back').onclick=()=>{activeUser=null;letters=[];current=0;dialog.close();read.clear();render();document.querySelector('#home').classList.remove('hidden');document.querySelector('#inbox').classList.add('hidden');window.scrollTo(0,0)};document.querySelector('#letter .close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};render();</script></html>
